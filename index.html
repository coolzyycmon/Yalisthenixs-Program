<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Yalisthenixs — Complete Calisthenics Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0c0d0f;--s1:#131417;--s2:#1a1c20;--line:#25272d;--line2:#3a3d45;
  --tx:#ebe8e0;--body:#d6d3ca;--dim:#9b9da4;--mute:#6a6d76;
  --ac:#e6b34a;--ac-ink:#171308;--ok:#78cf9d;--bad:#ee7b7b;
  --disp:'Big Shoulders Display','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --sans:'Instrument Sans','Helvetica Neue',Arial,system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(12,13,15,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:10px;height:54px}
.brand{font:800 22px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.dnav{display:none;margin-left:auto;gap:2px}
.dnav a{padding:8px 12px;border-radius:6px;color:var(--dim);text-decoration:none;font-size:15px;font-weight:500}
.dnav a.on{color:var(--tx);background:var(--s2)}
.iconbtn{margin-left:auto;background:none;border:1px solid var(--line);color:var(--dim);width:38px;height:38px;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{color:var(--tx);border-color:var(--line2)}
.gbar{height:2px;background:var(--line)}
.gbar i{display:block;height:100%;width:0;background:var(--ac);transition:width .4s ease}

/* bottom nav (phones) */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:rgba(12,13,15,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:12px;color:var(--mute);text-decoration:none}
.bnav a.on{color:var(--ac)}
.bnav svg,.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:760px){.bnav{display:none}.dnav{display:flex}.iconbtn{margin-left:0}}

#app{padding-bottom:100px}
@media(min-width:760px){#app{padding-bottom:64px}}

/* type */
h1{font:800 clamp(34px,8vw,50px)/1.03 var(--disp);letter-spacing:.005em;margin:30px 0 10px}
h2{font:700 24px/1.15 var(--disp);letter-spacing:.01em;margin:34px 0 8px}
.mark{font:900 clamp(46px,15.5vw,104px)/.9 var(--disp);letter-spacing:.02em;text-transform:uppercase;margin:34px 0 14px;overflow-wrap:anywhere}
.lede{color:var(--dim);font-size:17px;max-width:52ch;margin:0 0 22px}
.dim{color:var(--dim)}
.small{font-size:14px}
.crumb{display:inline-block;margin-top:22px;color:var(--dim);font-size:14px;text-decoration:none}
.crumb:hover{color:var(--tx)}

/* ladder */
.ladder{display:flex;gap:3px;margin:8px 0 10px}
.rung{flex:1;height:14px;background:var(--s2);border-radius:2px;overflow:hidden;display:block}
.rung i{display:block;height:100%;background:var(--ac)}
.pcttxt{display:flex;justify-content:space-between;color:var(--dim);font-size:14px;margin-bottom:22px}
.pcttxt b{color:var(--tx);font-weight:600}

/* buttons */
.btn{display:inline-block;background:var(--ac);color:var(--ac-ink);border:1px solid var(--ac);border-radius:8px;padding:13px 20px;font:600 16px/1.2 var(--sans);text-decoration:none;cursor:pointer;text-align:center}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--tx);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--dim);filter:none}
.btn.done{background:transparent;color:var(--ok);border-color:var(--ok)}
.btn.block{display:block;width:100%}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:26px 0}
.stat{padding:16px 0 14px}
.stat+.stat{padding-left:16px;border-left:1px solid var(--line)}
.stat b{display:block;font:800 38px/1 var(--disp)}
.stat span{color:var(--dim);font-size:13px}

/* rows */
.list{margin:6px 0 0}
.row{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.row:hover .t{color:var(--ac)}
.row .n{font:700 28px/1 var(--disp);color:var(--mute);width:32px;flex:none;padding-top:2px}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;font-size:17px;line-height:1.3}
.row .m{color:var(--dim);font-size:14px;margin-top:2px}
.row .r{color:var(--dim);font-size:13px;white-space:nowrap;padding-top:3px}
.tag{display:inline-block;border:1px solid var(--line2);border-radius:4px;padding:0 6px;font-size:12px;color:var(--dim);margin-right:8px;line-height:18px}
.mini{height:3px;background:var(--line);margin-top:10px;border-radius:2px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--ac)}
.chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center;margin-top:1px}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk svg{width:13px;height:13px;stroke:#0b1a10;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;display:none}
.chk.on svg{display:block}
.quizrow .n{color:var(--ac)}

/* lesson */
.eyebrow{color:var(--dim);font-size:14px;margin-top:22px}
.prose p{color:var(--body);font-size:17px;line-height:1.72;max-width:62ch;margin:0 0 18px}
.remember{border-left:2px solid var(--ac);padding:2px 0 2px 18px;margin:28px 0}
.remember h3{font:700 20px/1 var(--disp);letter-spacing:.02em;margin:0 0 10px}
.remember ul{margin:0;padding-left:18px;color:var(--body)}
.remember li{margin:6px 0;padding-left:2px}
.pn{display:grid;gap:10px;margin-top:26px}
@media(min-width:560px){.pn{grid-template-columns:1fr 1fr}}
.pn a{display:block;border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-decoration:none}
.pn a:hover{border-color:var(--line2)}
.pn small{display:block;color:var(--dim);font-size:12.5px}
.pn span{font-weight:600;line-height:1.3;display:block;margin-top:2px}

/* quiz */
.qtop{display:flex;justify-content:space-between;color:var(--dim);font-size:14px;margin:24px 0 8px}
.qbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:22px}
.qbar i{display:block;height:100%;background:var(--ac)}
.q{font:700 clamp(24px,6vw,30px)/1.15 var(--disp);margin:0 0 20px}
.opt{display:block;width:100%;text-align:left;background:var(--s1);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px;font-size:16px;line-height:1.4;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--dim)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:rgba(120,207,157,.1)}
.opt.bad{border-color:var(--bad);background:rgba(238,123,123,.1)}
.fb{margin:14px 0 4px;font-size:15px;color:var(--dim)}
.fb b{color:var(--tx)}
.score{font:900 clamp(64px,20vw,110px)/.9 var(--disp);margin:22px 0 6px}

/* tracker */
.skill{border-top:1px solid var(--line);padding:20px 0 22px}
.skill:last-child{border-bottom:1px solid var(--line)}
.skill .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.skill h3{font:700 26px/1 var(--disp);margin:0}
.skill .cur{color:var(--dim);font-size:14px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.chip{border:1px solid var(--line);background:transparent;color:var(--dim);padding:7px 12px;border-radius:999px;font-size:13.5px;cursor:pointer}
.chip.reached{color:var(--tx);border-color:var(--line2)}
.chip.on{background:var(--ac);color:var(--ac-ink);border-color:var(--ac);font-weight:600}
.best{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:14px;margin-top:6px}
.best input,.sbox{background:var(--s1);border:1px solid var(--line2);color:var(--tx);border-radius:8px;font:500 16px var(--sans);padding:9px 12px}
.best input{width:84px}
.sbox{width:100%;padding:14px 16px;font-size:17px}
.sbox::placeholder{color:var(--mute)}

/* search */
.hit{display:block;padding:15px 0;border-bottom:1px solid var(--line);text-decoration:none}
.hit:hover .t{color:var(--ac)}
.hit .t{font-weight:600;font-size:17px}
.hit .m{color:var(--dim);font-size:13px}
.hit p{margin:4px 0 0;color:var(--body);font-size:14.5px;line-height:1.5}
mark{background:rgba(230,179,74,.28);color:var(--tx);border-radius:2px;padding:0 1px}
.empty{color:var(--dim);margin-top:24px}

/* toast */
#toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,12px);background:var(--tx);color:#111;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:760px){#toast{bottom:32px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* print */
#printRoot{display:none}
@media print{
  :root{padding:0!important}
  html,body{background:#fff!important;color:#000!important}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block;font:11.5pt/1.5 Georgia,'Times New Roman',serif;color:#000}
  #printRoot h1{font:700 30pt/1.1 Georgia,serif;margin:0 0 4pt}
  #printRoot h2{font:700 18pt/1.2 Georgia,serif;margin:0 0 4pt;page-break-before:always}
  #printRoot h2.first{page-break-before:avoid}
  #printRoot h3{font:700 13pt/1.3 Georgia,serif;margin:16pt 0 4pt;page-break-after:avoid}
  #printRoot p{margin:0 0 7pt}
  #printRoot ul{margin:4pt 0 8pt;padding-left:16pt}
  #printRoot li{margin:2pt 0}
  #printRoot .meta{color:#444;font-size:10pt}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap in">
    <a class="brand" href="#/" aria-label="Yalisthenixs home">Yalisthenixs</a>
    <nav class="dnav" id="dnav" aria-label="Main"></nav>
    <button class="iconbtn" data-act="print" data-scope="all" aria-label="Print or save the full course as PDF" title="Print or save as PDF">
      <svg viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><rect x="4" y="9" width="16" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>
    </button>
  </div>
  <div class="gbar" role="progressbar" aria-label="Course progress" aria-valuemin="0" aria-valuemax="100" id="gbarwrap"><i id="gbar"></i></div>
</header>

<main id="app" class="wrap"></main>

<nav class="bnav" id="bnav" aria-label="Main"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="printRoot" aria-hidden="true"></div>

<script>
/* ---------- COURSE CONTENT ---------- */
const MODS=[
{t:"Calisthenics Fundamentals",lv:"Beginner",d:"Start here. Learn how bodyweight training scales, which movement patterns matter, and what a good rep looks like.",
 L:[
 {t:"How bodyweight training actually works",p:["In calisthenics your bodyweight is the load, and leverage is the dial. You don't add plates. You change the angle of your body, the length of the lever, or how much of your weight sits on your hands or feet.","That is why an incline push-up, a standard push-up and a planche lean are one movement at different difficulties. Once you see exercises as points on a leverage scale, progressions stop being random lists and start being a map."],k:["Difficulty comes from bodyweight and leverage together","Scale by changing angle, lever length or base of support","Same pattern with harder leverage is a progression","Both strength and skill improve with practice"]},
 {t:"The movement patterns",p:["Almost every bodyweight exercise falls into a small set of patterns: horizontal push (push-up), vertical push (pike push-up), horizontal pull (row), vertical pull (pull-up), squat, hinge, and trunk stability (plank, hollow hold).","Train every pattern each week. When one is missing, it shows up fast. Pull-light programs give cranky shoulders, and skipped leg days leave a weak base for everything else."],k:["Push and pull, horizontal and vertical","Squat and hinge for the legs","Trunk stability holds it all together","Hit every pattern weekly"]},
 {t:"What a good rep looks like",p:["A good rep uses the full range you own, at a speed you control, with no bouncing or swinging. If a rep needs momentum to finish, it is really a different exercise.","Use tempo to check yourself: about two seconds down, a brief pause at the hardest point, then a firm push or pull up. Stop a set when your next rep would break form, not when you are out of breath."],k:["Full range, controlled speed, no swinging","About 2 seconds down, pause, drive up","End the set when form would break"]}
 ],
 Q:[
 {q:"Which change makes a push-up harder without adding weight?",o:["Raising your feet above your hands","Raising your hands on a bench","Bending your knees","Doing it faster"],a:0},
 {q:"A pull-up belongs to which movement pattern?",o:["Vertical pull","Horizontal push","Hinge","Trunk stability"],a:0},
 {q:"A rep that needs swinging to finish should be...",o:["Cleaned up, since it is really a different exercise","Counted anyway","Done faster next time","Ignored"],a:0}
 ]},

{t:"Full-Body Foundations",lv:"Beginner",d:"How to structure your first weeks of training and warm up so your joints are ready for the work.",
 L:[
 {t:"Your first training week",p:["For a beginner, three full-body sessions a week is hard to beat. Each session practises every pattern, so skills improve faster than on a once-a-week split. Leave a rest day between sessions.","A simple session: a squat variation, a push, a pull, a trunk hold and five minutes of skill practice such as a hollow hold or dead hang. Do 2 to 3 sets of 5 to 8 clean reps and stop with a rep or two left in the tank."],k:["Three full-body days per week with rest between","One exercise per pattern each session","2 to 3 sets of 5 to 8 clean reps","Leave 1 to 2 reps in reserve"]},
 {t:"Warm-ups that prepare, not exhaust",p:["A warm-up has three jobs: raise your temperature, mobilise the joints you're about to load, and rehearse the movement with lighter versions. Two minutes of easy cardio, then wrist and shoulder circles, hip openers and cat-cows works well.","Finish with ramp-up sets of your first exercise, like incline push-ups before push-ups. Wrists deserve extra time, because push-ups, handstands and planche work all put your weight through them."],k:["Raise heat, mobilise, then rehearse","Ramp up with easier variations","Prep wrists before any hand-supported work","A warm-up should never tire you out"]}
 ],
 Q:[
 {q:"Why do beginners do well with three full-body days a week?",o:["Each pattern gets practised more often","Muscles only grow on training days","It removes the need for rest","It is simply easier to count"],a:0},
 {q:"The goal of a warm-up is to...",o:["Prepare joints and rehearse the movements","Fatigue the muscles first","Replace all stretching forever","Burn as many calories as possible"],a:0},
 {q:"Which body part needs extra prep before push-ups and handstands?",o:["Wrists","Ankles","Jaw","Toes"],a:0}
 ]},

{t:"Push: Chest",lv:"Beginner",d:"Push-up mechanics, the progression ladder from wall to one-arm, and how to use dips well.",
 L:[
 {t:"Push-up mechanics",p:["Set your hands just outside shoulder width, fingers spread, and lock your body into a straight plank with ribs down and glutes squeezed. Lower until your chest is a fist from the floor, elbows at about 45 degrees from your torso.","Flaring the elbows out to 90 degrees dumps stress on the front of the shoulder. Tucked elbows share the load with the chest and triceps. At the top, push the floor away so your shoulder blades spread slightly (protraction)."],k:["Hands just outside shoulder width","Straight plank from head to heels","Elbows around 45 degrees, not flared","Finish by pushing the floor away"]},
 {t:"The push progression ladder",p:["Work up one rung at a time: wall push-up, incline push-up, full push-up, decline push-up, archer push-up, pseudo planche push-up, then one-arm work. Use inclines rather than knee push-ups, because an incline keeps the plank position you will need later.","Move up when you hit 3 sets of 10 to 12 clean reps. Dips add another angle: lean forward for more chest, stay upright for more triceps, and keep your shoulders down and back at the bottom."],k:["Incline first, not knees","Move up at 3 sets of 10 to 12 clean reps","Forward-leaning dips hit more chest","Keep shoulders down and back in the dip"]}
 ],
 Q:[
 {q:"What is a good elbow angle relative to the torso in a push-up?",o:["About 45 degrees","About 90 degrees","Pinned to the ribs at 0 degrees","It makes no difference"],a:0},
 {q:"Why is an incline push-up easier than a floor push-up?",o:["Less bodyweight is loaded onto the arms","It uses different muscles","It has a shorter range","It needs no balance"],a:0},
 {q:"When should you move to a harder push-up variation?",o:["At 3 sets of 10 to 12 clean reps","After one perfect rep","Every week regardless","Never"],a:0}
 ]},

{t:"Pull: Back",lv:"Beginner",d:"How a pull-up really works, and a step-by-step route to your first full rep and beyond.",
 L:[
 {t:"Anatomy of a pull-up",p:["A pull-up starts before your elbows bend. Begin from a dead hang, then pull your shoulder blades down (scapular depression). Then drive your elbows down and back so your chest travels toward the bar.","The lats do most of the work, with help from the biceps, rear delts and mid-back. Palms away is a pull-up, palms toward you is a chin-up, which recruits more biceps. Skip the kip while you are learning: momentum hides weak spots."],k:["Depress the shoulder blades first","Drive elbows down and back","Lats lead, biceps assist","Chin-ups use more biceps than pull-ups"]},
 {t:"Building your first pull-up",p:["Stack these drills: dead hangs for 20 to 30 seconds, scapular pull-ups, inverted rows, slow negatives (jump up and lower over 4 to 5 seconds) and band-assisted reps.","Train them two or three times a week. Rows build volume and balance out your pushing. Once your negatives feel smooth, your first full rep is usually close."],k:["Dead hangs and scapular pulls first","Slow negatives of 4 to 5 seconds","Inverted rows for volume","Two or three pulling days per week"]}
 ],
 Q:[
 {q:"Which muscle does most of the work in a pull-up?",o:["Latissimus dorsi","Pectorals","Calves","Abdominals"],a:0},
 {q:"What is the first movement of a good pull-up?",o:["Depressing the shoulder blades","Bending the elbows","Kicking the legs","Tilting your head back"],a:0},
 {q:"A good way to build toward your first pull-up is...",o:["Slow negatives and inverted rows","Only stretching","Kipping as high as possible","Avoiding hangs"],a:0}
 ]},

{t:"Arms",lv:"Beginner",d:"Biceps, triceps and forearms, and how to train them safely with just your body.",
 L:[
 {t:"Biceps and triceps without dumbbells",p:["Your arms already work in every pull-up and push-up, but you can add targeted work. For biceps use chin-ups, ring or towel curls and slow negatives. For triceps use close-grip push-ups, bench or ring dips and bodyweight triceps extensions on a low bar or rings.","Choose variations where the elbow moves through a full range under control. Adding a slow lowering phase of three to four seconds makes almost any of them more effective."],k:["Chin-ups and ring curls for biceps","Close-grip push-ups and dips for triceps","Full range, controlled","Slow lowering makes them harder"]},
 {t:"Forearms, grip and tendon care",p:["Grip is often the first limit on hanging skills. Train it with dead hangs, towel hangs and fingertip holds, adding time before adding difficulty. Balance the flexors with wrist extension work such as band finger extensions.","Tendons adapt more slowly than muscle. If your elbows or wrists ache, you likely progressed faster than your connective tissue. Drop back a step, keep volume lower and build up over weeks."],k:["Add hang time before difficulty","Train wrist extensors too","Tendons adapt slower than muscles","Achy elbows: step back, build slowly"]}
 ],
 Q:[
 {q:"Which is an effective bodyweight biceps exercise?",o:["Ring curl","Pike push-up","Plank","Squat"],a:0},
 {q:"Why can elbow tendons ache when you progress quickly?",o:["Tendons adapt more slowly than muscles","Muscles stop recovering","It means you should push harder","Chalk causes it"],a:0},
 {q:"How should you build grip strength?",o:["Dead hangs, adding time first","Only very heavy weights","Never hang","Always use straps"],a:0}
 ]},

{t:"Shoulders",lv:"Intermediate",d:"Understand the shoulder blade, keep the rotator cuff healthy and start pressing overhead.",
 L:[
 {t:"The shoulder and the scapula",p:["The shoulder is the most mobile joint you own, which means it depends on muscles for stability. The shoulder blade moves in four main ways: it elevates, depresses, protracts and retracts. Skilled calisthenics is largely learning to control it.","The rotator cuff centres the ball in the socket. Keep it healthy with band external rotations and slow pulling work. A shoulder that cannot stay stable under load will complain long before it gets strong."],k:["Elevate, depress, protract, retract","Scapular control drives every skill","Rotator cuff keeps the joint centred"]},
 {t:"Overhead pressing with pike push-ups",p:["Start with a pike push-up: hips high, hands shoulder width, and lower your head between your hands in a slight arc. Then elevate your feet to shift more weight onto the shoulders, and work toward wall handstand push-ups.","Balance pressing with pulling. For every overhead set, do a set of rows, face pulls or band pull-aparts so the rear delts and mid-back keep pace."],k:["Hips high, head travels in a slight arc","Elevate feet to increase load","Pair every press with a pull"]}
 ],
 Q:[
 {q:"Which of these is NOT a shoulder blade movement?",o:["Hip hinge","Elevation","Depression","Protraction"],a:0},
 {q:"Why pair overhead pressing with rows and pull-aparts?",o:["They build the rear delts and mid-back for a stable shoulder","They cancel the pressing","They shorten workouts","They are only for warm-ups"],a:0},
 {q:"A pike push-up becomes harder when you...",o:["Elevate your feet","Lower your feet","Shorten the range","Bend your knees deeply"],a:0}
 ]},

{t:"Core",lv:"Intermediate",d:"Why the core is about stability, how to build a proper hollow body, and the path to leg raises and the L-sit.",
 L:[
 {t:"Core is stability, not just crunches",p:["Your core exists mostly to stop movement: to keep your spine from arching, twisting or collapsing while your limbs work. That is why planks and hollow body holds matter more than endless crunches.","The hollow hold is the shape behind handstands, levers and planches. Press your lower back into the floor, ribs down, pelvis tucked, arms overhead, legs low. If your lower back lifts, raise your legs or bend your knees."],k:["Core resists unwanted movement","Hollow hold: ribs down, pelvis tucked","If your back lifts, raise the legs"]},
 {t:"Leg raises and the L-sit",p:["Progress leg raises from knee tucks to hanging knee raises, then straight-leg raises and toes-to-bar. Keep the pelvis tucked so the abs, not just the hip flexors, do the work.","The L-sit combines compression strength with shoulder depression. Move from a tuck L-sit to one leg extended and then both legs. Press down hard through your hands and keep your arms locked."],k:["Tuck the pelvis on every raise","Tuck, then one leg, then full L-sit","Press down and lock the arms"]}
 ],
 Q:[

      <button class="btn" data-act="retake">Retake quiz</button>
      <a class="btn ghost" href="#/m/${i}">Back to lessons</a>
      ${i<MODS.length-1?`<a class="btn ghost" href="#/m/${i+1}">Next module</a>`:`<a class="btn ghost" href="#/course">All modules</a>`}
    </div>`;
  }
  const q=m.Q[Z.n],ord=Z.ord[Z.n],tot=m.Q.length;
  const opts=ord.map(k=>{
    let c='';if(Z.pick!==null){if(k===q.a)c='ok';else if(k===Z.pick)c='bad'}
    return `<button class="opt ${c}" data-act="ans" data-k="${k}" ${Z.pick!==null?'disabled':''}>${esc(q.o[k])}</button>`}).join('');
  let fb='';
  if(Z.pick!==null){fb=Z.pick===q.a?`<div class="fb"><b>Correct.</b></div>`:`<div class="fb"><b>Not quite.</b> The right answer is highlighted. Revisit the lessons if it is still unclear.</div>`}
  return `<a class="crumb" href="#/m/${i}">Module ${i+1}: ${esc(m.t)}</a>
  <div class="qtop"><span>Question ${Z.n+1} of ${tot}</span><span>${Z.score} correct</span></div>
  <div class="qbar"><i style="width:${(Z.n+(Z.pick!==null?1:0))/tot*100}%"></i></div>
  <h2 class="q">${esc(q.q)}</h2>
  ${opts}${fb}
  ${Z.pick!==null?`<div class="btns"><button class="btn" data-act="qnext">${Z.n<tot-1?'Next question':'See results'}</button></div>`:''}`;
}
function renderQuiz(){$('#app').innerHTML=quizView()}

/* tracker */
function trackerView(){
  return `<h1>Skill tracker</h1>
  <p class="lede">Tap the stage you are at right now. Tap it again to clear it. Log your best hold or rep count next to it.</p>
  <div class="pcttxt"><span><b>${skillsStarted()}</b> of ${SK.length} skills started</span></div>
  ${SK.map(s=>{
    const st=S.skills[s.id]||{stage:-1,best:''};
    const cur=st.stage>=0?s.s[st.stage]:'Not started';
    return `<section class="skill" aria-label="${esc(s.n)}">
      <div class="hd"><h3>${esc(s.n)}</h3><span class="cur">${esc(cur)}</span></div>
      <div class="mini" style="margin-top:10px"><i style="width:${(st.stage+1)/s.s.length*100}%"></i></div>
      <div class="chips">${s.s.map((x,k)=>`<button class="chip ${k===st.stage?'on':k<st.stage?'reached':''}" data-act="stage" data-skill="${s.id}" data-k="${k}" aria-pressed="${k===st.stage}">${esc(x)}</button>`).join('')}</div>
      <label class="best">Best <input type="number" inputmode="numeric" min="0" max="999" data-best="${s.id}" value="${esc(st.best===undefined?'':st.best)}" aria-label="${esc(s.n)} best in ${s.u}"> ${s.u}</label>
    </section>`}).join('')}`;
}

/* search */
const IDX=[];MODS.forEach((m,i)=>m.L.forEach((l,j)=>IDX.push({i,j,title:l.t,mod:m.t,body:l.p.join(' ')+' '+l.k.join(' ')})));
function searchResults(q){
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!terms.length)return `<p class="empty">Try a movement, muscle or idea, like pistol, lats or deload.</p>`;
  const res=IDX.map(x=>{
    const t=(x.title+' '+x.mod).toLowerCase(),b=x.body.toLowerCase();
    if(!terms.every(w=>t.includes(w)||b.includes(w)))return null;
    return{x,sc:terms.reduce((s,w)=>s+(t.includes(w)?5:0)+(b.includes(w)?1:0),0)};
  }).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,30);
  if(!res.length)return `<p class="empty">No lessons match that. Try a shorter word, like pull or squat.</p>`;
  const rx=new RegExp('('+terms.map(t=>reEsc(esc(t))).join('|')+')','gi');
  return res.map(({x})=>{
    const b=x.body,lb=b.toLowerCase();
    const pos=Math.min(...terms.map(w=>lb.indexOf(w)).filter(p=>p>=0).concat([9999]));
    const start=pos===9999?0:Math.max(0,pos-50);
    const snip=(start>0?'...':'')+b.slice(start,start+150)+(start+150<b.length?'...':'');
    return `<a class="hit" href="#/l/${lid(x.i,x.j)}"><div class="t">${esc(x.title).replace(rx,'<mark>$1</mark>')}</div><div class="m">Module ${x.i+1}: ${esc(x.mod)}</div><p>${esc(snip).replace(rx,'<mark>$1</mark>')}</p></a>`;
  }).join('');
}
function searchView(){
  return `<h1>Search lessons</h1>
  <input class="sbox" id="q" type="search" placeholder="Search movements, muscles, ideas" autocomplete="off" aria-label="Search lessons">
  <div id="res">${searchResults('')}</div>`;
}
function notFound(){return `<h1>Page not found</h1><p class="lede">That lesson or module does not exist.</p><a class="btn" href="#/course">Go to the course</a>`}

/* ---------- ROUTER ---------- */
function route(){
  const seg=(location.hash||'#/').slice(1).split('/').filter(Boolean);
  const v=seg[0]||'home',a=seg[1];
  let html,nav='home';
  if(v==='course'){html=courseView();nav='course'}
  else if(v==='m'){html=modView(+a);nav='course'}
  else if(v==='l'){const p=(a||'').split('-');html=lessonView(+p[0],+p[1]);nav='course'}
  else if(v==='q'){startQuiz(+a);html=quizView();nav='course'}
  else if(v==='tracker'){html=trackerView();nav='tracker'}
  else if(v==='search'){html=searchView();nav='search'}
  else html=homeView();
  $('#app').innerHTML=html;
  chrome(nav);
  try{window.scrollTo(0,0)}catch(e){}
  if(v==='search'){const q=$('#q');if(q)q.focus({preventScroll:true})}
}
function chrome(nav){
  document.querySelectorAll('[data-nav]').forEach(a=>{const on=a.dataset.nav===nav;a.classList.toggle('on',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('#gbar').style.width=pct()+'%';
  $('#gbarwrap').setAttribute('aria-valuenow',pct());
}
window.addEventListener('hashchange',route);

/* ---------- PRINT ---------- */
function lessonPrint(l){return `<h3>${esc(l.t)}</h3>${l.p.map(p=>`<p>${esc(p)}</p>`).join('')}<ul>${l.k.map(k=>`<li>${esc(k)}</li>`).join('')}</ul>`}
function buildPrint(scope){
  let mods,only=null,h='';
  if(scope==='all'){mods=MODS.map((_,i)=>i);h+=`<h1>Yalisthenixs</h1><p class="meta">Complete Calisthenics Course</p>`}
  else if(scope[0]==='m'){mods=[+scope.slice(1)]}
  else{const p=scope.split('-');mods=[+p[0]];only=scope}
  mods.forEach((i,idx)=>{
    h+=`<h2 class="${scope!=='all'&&idx===0?'first':''}">${i+1}. ${esc(MODS[i].t)}</h2><p class="meta">${MODS[i].lv}. ${esc(MODS[i].d)}</p>`;
    MODS[i].L.forEach((l,j)=>{if(only&&only!==lid(i,j))return;h+=lessonPrint(l)});
  });
  return h;
}
function doPrint(scope){
  $('#printRoot').innerHTML=buildPrint(scope);
  try{window.print()}catch(e){toast('Printing is not available here')}
}
window.addEventListener('afterprint',()=>{$('#printRoot').innerHTML=''});

/* ---------- EVENTS ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act;
  if(act==='print'){doPrint(b.dataset.scope)}
  else if(act==='toggle'){
    const id=b.dataset.id;S.done[id]=!S.done[id];if(!S.done[id])delete S.done[id];save();
    const on=!!S.done[id];
    b.classList.toggle('done',on);b.textContent=on?'Completed. Tap to undo':'Mark lesson complete';
    chrome('course');
    toast(on?'Lesson complete. Progress '+pct()+'%':'Lesson marked incomplete');
  }
  else if(act==='ans'){if(Z.pick!==null)return;Z.pick=+b.dataset.k;if(Z.pick===MODS[Z.i].Q[Z.n].a)Z.score++;renderQuiz()}
  else if(act==='qnext'){
    const tot=MODS[Z.i].Q.length;
    if(Z.n<tot-1){Z.n++;Z.pick=null}
    else{Z.done=true;const p=S.quiz[Z.i];if(!p||Z.score>p.best){S.quiz[Z.i]={best:Z.score,total:tot}}save();chrome('course')}
    renderQuiz();try{window.scrollTo(0,0)}catch(err){}
  }
  else if(act==='retake'){startQuiz(Z.i);renderQuiz();try{window.scrollTo(0,0)}catch(err){}}
  else if(act==='stage'){
    const id=b.dataset.skill,k=+b.dataset.k;
    const cur=S.skills[id]||{stage:-1,best:''};
    S.skills[id]={stage:cur.stage===k?-1:k,best:cur.best};save();
    const y=window.scrollY;$('#app').innerHTML=trackerView();try{window.scrollTo(0,y)}catch(err){}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.best){
    const id=t.dataset.best,cur=S.skills[id]||{stage:-1,best:''};
    S.skills[id]={stage:cur.stage,best:t.value};save();
  }
  else if(t.id==='q'){$('#res').innerHTML=searchResults(t.value)}
});

route();
</script>
</body>
</html>
